<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14181C" />
    <title>Le jeu s'appelle maintenant Infiltré</title>
    <link rel="canonical" href="https://lelongg.github.io/artefacts/infiltre/" />
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #14181c;
        color: #d9d2c0;
        font-family: system-ui, sans-serif;
        padding: 24px;
        text-align: center;
      }
      main { max-width: 340px; }
      h1 { font-size: 22px; margin: 0 0 12px; }
      p { font-size: 14px; line-height: 1.6; color: rgba(217, 210, 192, .65); }
      a {
        display: inline-block;
        margin-top: 18px;
        background: #b3372e;
        color: #f3ede1;
        text-decoration: none;
        padding: 14px 22px;
        border-radius: 4px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Le jeu s'appelle maintenant Infiltré</h1>
      <p>
        Il a déménagé. Si tu l'avais installé sur ton écran d'accueil, supprime l'ancienne icône et réinstalle-le
        depuis la nouvelle adresse.
      </p>
      <a href="../infiltre/">Ouvrir Infiltré</a>
    </main>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        });
        if (window.caches) caches.keys().then(function (n) { n.forEach(function (c) { caches.delete(c); }); });
      }
      setTimeout(function () { window.location.replace("../infiltre/"); }, 2500);
    </script>
  </body>
</html>
